name: Generate weather bulletin

on:
  push:
    branches: [main]
    paths: ['.github/workflows/generate-video.yml']
  workflow_dispatch:
  # Start 75 minutes before the requested public slots in Belém (UTC-3):
  # 05:30, 09:00, 12:00, 13:00, 14:00 and 15:00. GitHub cron uses UTC.
  schedule:
    - cron: '15 7 * * *'
    - cron: '45 10 * * *'
    - cron: '45 13 * * *'
    - cron: '45 14 * * *'
    - cron: '45 15 * * *'
    - cron: '45 16 * * *'

permissions:
  contents: read

concurrency:
  group: trovox-weather-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VIDEO_PROFILE: balanced
      VIDEO_AUTOSTART: "false"
      VIDEO_OUTPUT_DIR: output
      VIDEO_TIMEZONE: America/Belem
      VIDEO_AGENT_MIN_INTERVAL: "12"
      VIDEO_TTS_WORKERS: "2"
      CHROMIUM_BIN: ${{ github.workspace }}/.cache/chromium/chrome
      WAV2LIP_CHECKPOINT: ${{ github.workspace }}/.cache/wav2lip/wav2lip-compatible.pth
      WAV2LIP_CHECKPOINT_URL: ${{ secrets.WAV2LIP_CHECKPOINT_URL }}
      LIPSYNC_PYTHON: ${{ github.workspace }}/.local/venv/bin/python
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UCOrGMudYslWWWmpW8pu3UDg' }}
      YOUTUBE_PRIVACY: public
    steps:
      - uses: actions/checkout@v4

      - name: Set the requested YouTube publication time
        if: github.event_name == 'schedule'
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE_CRON" in
            '15 7 * * *') target='08:30' ;;
            '45 10 * * *') target='12:00' ;;
            '45 13 * * *') target='15:00' ;;
            '45 14 * * *') target='16:00' ;;
            '45 15 * * *') target='17:00' ;;
            '45 16 * * *') target='18:00' ;;
            *) echo "Unexpected schedule: $SCHEDULE_CRON" >&2; exit 1 ;;
          esac
          echo "YOUTUBE_PUBLISH_AT=$(date -u -d "today $target" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Confirm upload credentials
        run: |
          test -n "$YOUTUBE_CLIENT_ID" && test -n "$YOUTUBE_CLIENT_SECRET" && test -n "$YOUTUBE_REFRESH_TOKEN"
          test -n "$YOUTUBE_CHANNEL_ID"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lipsync.txt

      - name: Restore verified lip-sync checkpoint
        uses: actions/cache@v4
        with:
          path: .cache/wav2lip
          key: wav2lip-checkpoint-${{ runner.os }}-${{ hashFiles('deploy/model.json') }}

      - name: Install video and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1
          python -m pip install --upgrade pip playwright
          python -m playwright install chromium --with-deps
          mkdir -p .cache/chromium
          browser="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -n 1)"
          test -n "$browser"
          ln -s "$browser" .cache/chromium/chrome

      - name: Install validated renderer
        run: |
          test -n "$WAV2LIP_CHECKPOINT_URL" || { echo 'Configure o secret WAV2LIP_CHECKPOINT_URL'; exit 1; }
          bash scripts/install_local.sh

      - name: Generate optimized bulletin
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          .local/venv/bin/python scripts/produce_bulletin.py --directory "output/trovox-${stamp}"
          echo "BULLETIN_DIR=output/trovox-${stamp}" >> "$GITHUB_ENV"

      - name: Upload to YouTube
        run: |
          args=(--directory "$BULLETIN_DIR")
          if [ -n "${YOUTUBE_PUBLISH_AT:-}" ]; then
            args+=(--publish-at "$YOUTUBE_PUBLISH_AT")
          fi
          .local/venv/bin/python scripts/upload_youtube.py "${args[@]}"

      - name: Upload video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trovox-weather-bulletin-${{ github.run_id }}
          path: output/**
          if-no-files-found: warn
          retention-days: 1
