name: Generate TROVOX GLOBAL long bulletin

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Regional edition'
        required: true
        default: usa-canada
        type: choice
        options: [usa-canada, europe, africa, australia, asia]

permissions:
  contents: read

concurrency:
  group: trovox-global-long-bulletin
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORLD_YOUTUBE_CLIENT_ID: ${{ secrets.WORLD_YOUTUBE_CLIENT_ID }}
      WORLD_YOUTUBE_CLIENT_SECRET: ${{ secrets.WORLD_YOUTUBE_CLIENT_SECRET }}
      WORLD_YOUTUBE_REFRESH_TOKEN: ${{ secrets.WORLD_YOUTUBE_REFRESH_TOKEN }}
      WORLD_YOUTUBE_CHANNEL_ID: UCO2hrF6OlctVIEd3AcIxilw
      WAV2LIP_CHECKPOINT: ${{ github.workspace }}/.cache/wav2lip/wav2lip-compatible.pth
      WAV2LIP_CHECKPOINT_URL: ${{ secrets.WAV2LIP_CHECKPOINT_URL }}
      LIPSYNC_PYTHON: ${{ github.workspace }}/.local/venv/bin/python
      LIGHTNING_API_URL: https://lightning-agent.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lipsync.txt
      - uses: actions/cache@v4
        with:
          path: .cache/wav2lip
          key: wav2lip-checkpoint-${{ runner.os }}-${{ hashFiles('deploy/model.json') }}
      - name: Install renderer
        run: |
          test -n "$WAV2LIP_CHECKPOINT_URL"
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1
          bash scripts/install_local.sh
      - name: Generate five-minute bulletin
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dir="output/trovox-global-${{ inputs.region }}-${stamp}"
          .local/venv/bin/python scripts/generate_world_bulletin.py --directory "$dir" --region "${{ inputs.region }}"
          echo "BULLETIN_DIR=$dir" >> "$GITHUB_ENV"
      - name: Upload only to TROVOX GLOBAL
        run: .local/venv/bin/python scripts/upload_world_bulletin.py "$BULLETIN_DIR"
      - name: Save bulletin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trovox-global-long-${{ github.run_id }}
          path: output/**
          retention-days: 2
          if-no-files-found: warn
